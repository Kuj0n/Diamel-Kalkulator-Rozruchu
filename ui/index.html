<!doctype html>
<html lang="pl" data-motyw="ciemny">
<head>
<meta charset="utf-8">
<title>Kalkulator Rozruchu</title>
<link rel="stylesheet" href="styl.css">
</head>
<body>

<div class="okno">
  <aside class="boczne">
    <div class="marka"><img src="logo.png" alt=""><div>Kalkulator Rozruchu<small id="boczne-wersja">DIAMEL</small></div></div>
    <button class="poz akt" data-widok="obliczenia"><svg class="ik" viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M7 7V4h3v3M14 7V4h3v3M13 10l-3 4h4l-3 4"/></svg>Obliczenia</button>
    <button class="poz" data-widok="baza"><svg class="ik" viewBox="0 0 24 24"><ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v14c0 1.7 3.6 3 8 3s8-1.3 8-3V5M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/></svg>Baza urządzeń<span class="licznik zolty ukryty" id="licznik-baza"></span></button>
    <button class="poz" data-widok="ustawienia"><svg class="ik" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"/></svg>Ustawienia<span class="licznik zolty ukryty" id="licznik-ustawienia"></span></button>
    <button class="poz" data-widok="zglos"><svg class="ik" viewBox="0 0 24 24"><path d="M22 2 11 13M22 2l-7 20-4-9-9-4Z"/></svg>Zgłoszenia</button>
    <div class="dol">
      <div id="dol-projekt"></div>
      <div id="dol-baza"></div>
      <div id="dol-wersja"></div>
      <div class="motyw" id="motyw">
        <button data-motyw="jasny" title="Jasny"><svg class="ik" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>Jasny</button>
        <button data-motyw="ciemny" title="Ciemny"><svg class="ik" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>Ciemny</button>
        <button data-motyw="system" title="Jak w Windows"><svg class="ik" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg>System</button>
      </div>
    </div>
  </aside>

  <main class="glowna" id="glowna">
    <div class="pasek">
      <div><span class="eyebrow" id="pasek-nad">Kalkulator Rozruchu</span><h1 id="pasek-tytul">Obliczenia</h1></div>
      <div class="prawe" id="pasek-prawe"></div>
    </div>
    <section class="widok obliczenia" id="widok-obliczenia"></section>
    <section class="widok ukryty" id="widok-baza"></section>
    <section class="widok ukryty" id="widok-ustawienia"></section>
    <section class="widok ukryty" id="widok-zglos"></section>
  </main>
</div>

<div class="powiadomienia" id="powiadomienia"></div>
<div id="modal-miejsce"></div>

<script src="app.js"></script>
</body>
</html>
